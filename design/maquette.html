/* ---------- Dialogues ---------- */
let modal = null;
function openModal(html, { onClose, labelledby } = {}) {
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = html;
  const box = overlay.firstElementChild;
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  if (labelledby) box.setAttribute("aria-labelledby", labelledby);
  const previous = document.activeElement;
  overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) closeModal(); });
  overlay.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    const f = $$('button:not([disabled]), input, textarea, select, [tabindex]:not([tabindex="-1"])', box).filter((x) => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });
  $("#layer").appendChild(overlay);
  modal = { overlay, onClose, previous };
  return box;
}
function closeModal() {
  if (!modal) return;
  const { overlay, onClose, previous } = modal;
  modal = null;
  overlay.remove();
  onClose?.();
  if (previous && document.contains(previous)) previous.focus({ preventScroll: true });
}
function confirmDialog({ title, text, confirm, danger, onConfirm }) {
  const box = openModal(`<div class="dialog"><h2 id="dlg-title">${esc(title)}</h2><p>${esc(text)}</p>
    <div class="dialog-actions"><button class="btn btn-ghost" type="button" data-dlg="cancel">Annuler</button>
    <button class="btn ${danger ? "btn-danger" : "btn-primary"}" type="button" data-dlg="ok">${esc(confirm)}</button></div></div>`, { labelledby: "dlg-title" });
  box.addEventListener("click", (e) => {
    const b = e.target.closest("[data-dlg]");
    if (!b) return;
    const ok = b.dataset.dlg === "ok";
    modal.previous = null;
    closeModal();
    if (ok) onConfirm();
  });
  $('[data-dlg="cancel"]', box).focus();
}
function dateDialog(id) {
  const c = byId(id);
  const box = openModal(`<div class="dialog"><h2 id="dlg-title">Relancer ${esc(c.name)}</h2>
    <form novalidate><div class="field"><label for="dlg-date">Date de relance</label><input class="input" id="dlg-date" type="date" min="${today()}" value="${c.followUp || addDays(today(), 1)}" required><span class="error" id="dlg-error" role="alert"></span></div>
    <div class="dialog-actions"><button class="btn btn-ghost" type="button" data-dlg="cancel">Annuler</button><button class="btn btn-primary" type="submit">Planifier</button></div></form></div>`, { labelledby: "dlg-title" });
  $('[data-dlg="cancel"]', box).addEventListener("click", closeModal);
  $("form", box).addEventListener("submit", (e) => {
    e.preventDefault();
    const value = $("#dlg-date", box).value;
    const r = setFollowUp(id, value || "invalide");
    if (!r.ok) { $("#dlg-error", box).textContent = r.error; $("#dlg-date", box).setAttribute("aria-invalid", "true"); return; }
    restore(r.before); // on rejoue via planFollowUp pour la notification
    closeModal();
    planFollowUp(id, value);
  });
  $("#dlg-date", box).focus();
}
function quickAdd(stage = "new") {
  const box = openModal(`<div class="dialog"><h2 id="dlg-title">Nouveau contact</h2>
    <form novalidate>
      <div class="field"><label for="qa-name">Nom</label><input class="input" id="qa-name" placeholder="Camille Martin" autocomplete="off" aria-describedby="qa-error"><span class="error" id="qa-error" role="alert"></span></div>
      <div class="field"><label for="qa-company">Entreprise <span class="hint">(facultatif)</span></label><input class="input" id="qa-company" placeholder="Atelier Lumen" autocomplete="off"></div>
      <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:6px">Étape</legend><div class="option-row">
        ${STAGES.map((s) => `<label class="option"><input type="radio" name="qa-stage" value="${s.id}" ${s.id === stage ? "checked" : ""}><span>${s.label}</span></label>`).join("")}</div></fieldset>
      <fieldset class="field" id="qa-follow" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:6px">Relance</legend><div class="option-row">
        <label class="option"><input type="radio" name="qa-follow" value="" checked><span>Aucune</span></label>
        ${QUICK.slice(0, 4).map((q) => `<label class="option"><input type="radio" name="qa-follow" value="${q.key}"><span>${q.label}</span></label>`).join("")}</div></fieldset>
      <div class="dialog-actions"><button class="btn btn-ghost" type="button" data-dlg="cancel">Annuler</button><button class="btn btn-primary" type="submit">Ajouter<span class="kbd">↵</span></button></div>
    </form></div>`, { labelledby: "dlg-title" });
  const syncFollow = () => {
    const closed = CLOSED.has($('input[name="qa-stage"]:checked', box).value);
    $("#qa-follow", box).hidden = closed;
  };
  box.addEventListener("change", syncFollow);
  syncFollow();
  $('[data-dlg="cancel"]', box).addEventListener("click", closeModal);
  $("form", box).addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("#qa-name", box).value;
    const st = $('input[name="qa-stage"]:checked', box).value;
    const fk = $('input[name="qa-follow"]:checked', box).value;
    const r = addContact({ name, company: $("#qa-company", box).value, stage: st, followUp: fk && !CLOSED.has(st) ? quick(fk).date() : null });
    if (!r.ok) { $("#qa-error", box).textContent = r.error; $("#qa-name", box).setAttribute("aria-invalid", "true"); $("#qa-name", box).focus(); return; }
    closeModal();
    refresh();
    toast(`${r.contact.name} ajouté${r.contact.name.endsWith("e") ? "(e)" : ""}`, [{ label: "Ouvrir la fiche", run: () => openDrawer(r.contact.id) }]);
  });
  $("#qa-name", box).focus();
}
function helpDialog() {
  const mod = isMac ? "⌘" : "Ctrl";
  const rows = [
    ["Rechercher, lancer une commande", [mod, "K"]], ["Nouveau contact", ["N"]], ["Aller à Aujourd’hui", ["G", "T"]],
    ["Aller au Pipeline", ["G", "P"]], ["Aller aux Contacts", ["G", "C"]], ["Rechercher dans les contacts", ["/"]],
    ["Déplacer une carte du pipeline", ["Alt", "←", "→"]], ["Ouvrir la fiche sélectionnée", ["Entrée"]], ["Fermer (fiche, fenêtre, menu)", ["Échap"]],
  ];
  const box = openModal(`<div class="dialog"><h2 id="dlg-title">Raccourcis clavier</h2>
    <dl class="shortcuts">${rows.map(([l, keys]) => `<dt>${esc(l)}</dt><dd>${keys.map((k) => `<span class="kbd">${esc(k)}</span>`).join("")}</dd>`).join("")}</dl>
    <div class="dialog-actions"><button class="btn btn-primary" type="button" data-dlg="cancel">Compris</button></div></div>`, { labelledby: "dlg-title" });
  $('[data-dlg="cancel"]', box).addEventListener("click", closeModal);
  $('[data-dlg="cancel"]', box).focus();
}

/* ---------- Palette de commandes ---------- */
function paletteCommands() {
  return [
    { label: "Nouveau contact", hint: "N", icon: "plus", run: () => quickAdd() },
    ...VIEWS.map((v) => ({ label: `Aller à ${v.label}`, hint: `G ${v.key}`, icon: v.icon, run: () => go(v.id) })),
    { label: "Thème clair", icon: "sun", run: () => applyTheme("light") },
    { label: "Thème sombre", icon: "moon", run: () => applyTheme("dark") },
    { label: "Thème du système", icon: "monitor", run: () => applyTheme("system") },
    { label: "Raccourcis clavier", hint: "?", icon: "keyboard", run: helpDialog },
    { label: "Réinitialiser les données de démo", icon: "refresh", run: resetData },
  ];
}
function openPalette() {
  const box = openModal(`<div class="palette"><div class="palette-input">${icon("search")}<input id="pal-input" placeholder="Rechercher un contact ou une commande…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="pal-list" aria-label="Rechercher"><span class="kbd">Échap</span></div>
    <ul class="palette-list" id="pal-list" role="listbox"></ul>
    <div class="palette-foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> naviguer</span><span><span class="kbd">↵</span> ouvrir</span></div></div>`);
  const input = $("#pal-input", box), list = $("#pal-list", box);
  let items = [], sel = 0;
  const render = () => {
    const q = normalize(input.value.trim());
    const contacts = (q ? db.contacts.filter((c) => normalize(c.name).includes(q) || normalize(c.company).includes(q))
      : [...dueGroups().overdue, ...dueGroups().today]).slice(0, 7)
      .map((c) => ({ contact: c, run: () => openDrawer(c.id) }));
    const commands = paletteCommands().filter((cmd) => !q || normalize(cmd.label).includes(q));
    items = [...contacts, ...commands];
    sel = Math.min(sel, Math.max(items.length - 1, 0));
    if (!items.length) { list.innerHTML = `<li class="palette-empty">Aucun résultat pour « ${esc(input.value)} »</li>`; return; }
    let html = "", i = 0;
    if (contacts.length) html += `<li class="palette-group" role="presentation">${q ? "Contacts" : "À relancer"}</li>` + contacts.map((it) => {
      const c = it.contact, idx = i++;
      return `<li class="palette-item" role="option" id="pal-${idx}" data-i="${idx}" aria-selected="${idx === sel}">${avatar(c, "avatar-sm")}<span class="row-main"><span class="row-title">${esc(c.name)}</span><span class="row-sub">${esc(c.company || STAGE_LABEL[c.stage])}</span></span>${chip(c)}</li>`;
    }).join("");
    if (commands.length) html += `<li class="palette-group" role="presentation">Commandes</li>` + commands.map((cmd) => {
      const idx = i++;
      return `<li class="palette-item" role="option" id="pal-${idx}" data-i="${idx}" aria-selected="${idx === sel}">${icon(cmd.icon)}<span class="row-main"><span>${esc(cmd.label)}</span></span>${cmd.hint ? `<small><span class="kbd">${esc(cmd.hint)}</span></small>` : ""}</li>`;
    }).join("");
    list.innerHTML = html;
    input.setAttribute("aria-activedescendant", `pal-${sel}`);
    $(`#pal-${sel}`, list)?.scrollIntoView({ block: "nearest" });
  };
  const run = (i) => { const it = items[i]; if (!it) return; modal.previous = null; closeModal(); it.run(); };
  input.addEventListener("input", () => { sel = 0; render(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % Math.max(items.length, 1); render(); }
    if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + items.length) % Math.max(items.length, 1); render(); }
    if (e.key === "Enter") { e.preventDefault(); run(sel); }
  });
  list.addEventListener("mousemove", (e) => { const li = e.target.closest("[data-i]"); if (li && +li.dataset.i !== sel) { sel = +li.dataset.i; render(); } });
  list.addEventListener("click", (e) => { const li = e.target.closest("[data-i]"); if (li) run(+li.dataset.i); });
  render();
  input.focus();
}

/* ---------- Thème ---------- */
function applyTheme(choice) {
  if (choice === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", choice);
  $$("#theme-switch [data-value]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === choice)));
  try { localStorage.setItem(THEME_KEY, choice); } catch {}
}
function currentTheme() { try { return localStorage.getItem(THEME_KEY) || "system"; } catch { return "system"; } }

function resetData() {
  confirmDialog({
    title: "Réinitialiser les données ?", text: "Les contacts de démonstration sont recréés, vos modifications dans la maquette sont perdues.",
    confirm: "Réinitialiser", danger: true,
    onConfirm: () => { closeDrawer(); db = seedData(); save(); refresh(); toast("Données de démonstration réinitialisées"); },
  });
}

/* ---------- Routage (#/vue?filtres) ---------- */
function go(view) { location.hash = `#/${view}`; }
function route() {
  const [path, query] = location.hash.replace(/^#\/?/, "").split("?");
  ui.view = VIEWS.some((v) => v.id === path) ? path : "aujourdhui";
  if (ui.view === "contacts") {
    const p = new URLSearchParams(query || "");
    ui.q = p.get("q") || "";
    ui.stage = STAGE_IDS.includes(p.get("stage")) ? p.get("stage") : null;
  }
  mounted = null;
  closeMenu(false);
  renderView();
  $("#view").focus({ preventScroll: true });
  scrollTo({ top: 0 });
}

/* ---------- Événements ---------- */
document.addEventListener("click", (e) => {
  if (menu && !menu.el.contains(e.target) && !menu.anchor.contains(e.target)) closeMenu(false);
  const el = e.target.closest("[data-action]");
  if (el && !el.closest(".menu, .overlay, .toast")) { onAction(el.dataset.action, el); return; }
  const open = e.target.closest("[data-open]");
  if (open && !e.target.closest("a, button, input, textarea, select, label")) openDrawer(+open.dataset.open);
});

function onAction(action, el) {
  const id = el.dataset.id ? +el.dataset.id : null;
  switch (action) {
    case "new": quickAdd(el.dataset.stage || "new"); break;
    case "palette": openPalette(); break;
    case "help": helpDialog(); break;
    case "reset": resetData(); break;
    case "theme": applyTheme(el.dataset.value); break;
    case "cycle-theme": { const order = ["light", "dark", "system"]; applyTheme(order[(order.indexOf(currentTheme()) + 1) % 3]); break; }
    case "goto": go(el.dataset.view); break;
    case "close": closeDrawer(); break;
    case "done": doneFollowUp(id); break;
    case "snooze-menu": if (menu?.anchor === el) closeMenu(); else openMenu(el, snoozeItems(id)); break;
    case "card-menu": if (menu?.anchor === el) closeMenu(); else openMenu(el, cardItems(id)); break;
    case "drawer-menu": openMenu(el, [
      { html: `${icon("check")}Relance faite`, run: () => doneFollowUp(ui.openId) },
      { html: `${icon("calendar")}Choisir une date de relance…`, run: () => dateDialog(ui.openId) },
      "sep",
      { html: `${icon("trash")}Supprimer…`, danger: true, run: () => deleteContact(ui.openId) },
    ].filter((it, i) => !(CLOSED.has(byId(ui.openId).stage) && i < 2) && !(i === 0 && !byId(ui.openId).followUp))); break;
    case "set-stage": moveStage(ui.openId, el.dataset.value); break;
    case "followup": planFollowUp(ui.openId, quick(el.dataset.value).date()); break;
    case "followup-clear": { const r = setFollowUp(ui.openId, null); refresh(); toast("Relance retirée", [{ label: "Annuler", run: () => { restore(r.before); refresh(); } }]); break; }
    case "delete": deleteContact(id); break;
    case "filter-stage": ui.stage = el.dataset.value || null; syncContactsHash(); renderView(); break;
    case "clear-filters": ui.q = ""; ui.stage = null; syncContactsHash(); mounted = null; renderView(); $("#contact-search")?.focus(); break;
    case "sort": {
      const key = el.dataset.key;
      ui.sort = ui.sort.key === key ? { key, dir: ui.sort.dir === "asc" ? "desc" : "asc" } : { key, dir: key === "created" ? "desc" : "asc" };
      renderView(); break;
    }
  }
}

document.addEventListener("input", (e) => {
  if (e.target.id === "contact-search") { ui.q = e.target.value; syncContactsHash(); renderContactsResults(); return; }
  if (e.target.dataset.field && e.target.closest("#drawer")) scheduleField(e.target);
});
document.addEventListener("change", (e) => {
  if (e.target.id === "followup-date" && e.target.value) {
    if (!planFollowUp(ui.openId, e.target.value)) e.target.value = byId(ui.openId)?.followUp || "";
  }
});
document.addEventListener("focusout", (e) => { if (e.target.dataset?.field && pendingField === e.target) flushField(); });

/* Glisser-déposer (Pipeline) */
let dragId = null;
document.addEventListener("dragstart", (e) => {
  const card = e.target.closest?.(".deal");
  if (!card) return;
  dragId = +card.dataset.id;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", String(dragId));
  requestAnimationFrame(() => card.classList.add("is-dragging"));
});
document.addEventListener("dragend", () => { dragId = null; $$(".is-dragging, .is-over").forEach((el) => el.classList.remove("is-dragging", "is-over")); });
document.addEventListener("dragover", (e) => {
  const zone = e.target.closest?.("[data-drop]");
  if (!zone || dragId === null) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  $$(".is-over").forEach((el) => el !== zone && el.classList.remove("is-over"));
  zone.classList.add("is-over");
});
document.addEventListener("dragleave", (e) => {
  const zone = e.target.closest?.("[data-drop]");
  if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove("is-over");
});
document.addEventListener("drop", (e) => {
  const zone = e.target.closest?.("[data-drop]");
  if (!zone || dragId === null) return;
  e.preventDefault();
  const id = dragId;
  dragId = null;
  zone.classList.remove("is-over");
  moveStage(id, zone.dataset.drop);
});

/* Clavier */
let gPending = 0;
document.addEventListener("keydown", (e) => {
  const typing = e.target.matches?.("input, textarea, select, [contenteditable]");
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); modal ? closeModal() : openPalette(); return; }
  if (e.key === "Escape") {
    if (menu) { e.preventDefault(); closeMenu(); return; }
    if (modal) { e.preventDefault(); closeModal(); return; }
    if (ui.openId !== null) { e.preventDefault(); closeDrawer(); return; }
    if (typing) e.target.blur();
    return;
  }
  if (modal || menu) return;
  const target = e.target;
  if (target.matches?.(".deal") && e.altKey && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    e.preventDefault();
    const c = byId(+target.dataset.id);
    const next = STAGE_IDS[STAGE_IDS.indexOf(c.stage) + (e.key === "ArrowRight" ? 1 : -1)];
    if (next) moveStage(c.id, next, { focus: true });
    return;
  }
  if ((e.key === "Enter" || e.key === " ") && target.matches?.("[data-open]:not(button)") && !typing) { e.preventDefault(); openDrawer(+target.dataset.open); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (Date.now() - gPending < 1200) {
    gPending = 0;
    const view = { t: "aujourdhui", p: "pipeline", c: "contacts" }[k];
    if (view) { e.preventDefault(); go(view); }
    return;
  }
  if (k === "g") { gPending = Date.now(); return; }
  if (k === "n") { e.preventDefault(); quickAdd(); return; }
  if (e.key === "?") { e.preventDefault(); helpDialog(); return; }
  if (e.key === "/") {
    e.preventDefault();
    if (ui.view === "contacts") $("#contact-search")?.focus(); else openPalette();
  }
});

/* ---------- Démarrage ---------- */
$("#mod-key").textContent = isMac ? "⌘K" : "Ctrl K";
$(".mobile-theme").hidden = !matchMedia("(max-width: 768px)").matches;
matchMedia("(max-width: 768px)").addEventListener("change", (e) => ($(".mobile-theme").hidden = !e.matches));
applyTheme(currentTheme());
addEventListener("hashchange", route);
addEventListener("storage", (e) => { if (e.key === STORE_KEY) { db = load(); refresh(); } });
route();
</script>
</body>
</html>
